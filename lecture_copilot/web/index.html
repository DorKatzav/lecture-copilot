<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lecture Copilot</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@500;700;800&family=Assistant:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#F6F6F2; --panel:#FFFFFF; --panel2:#EEEFEA; --ink:#1C2030; --ink2:#4D5468; --mute:#7C8398; --line:#D9DBD3;
  --accent:#C8412F; --accent-soft:#FBE9E5; --local:#1E6F80; --local-soft:#E1F0F2; --cloud:#7A4FA8; --cloud-soft:#EFE7F8;
  --ok:#2E7D4F; --ok-soft:#E3F2E8; --warn:#B7791F; --warn-soft:#FBF1DC; --code:#F0F1EC;
  --shadow:0 1px 2px rgba(20,24,40,.06),0 6px 20px rgba(20,24,40,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#15171E; --panel:#1D2029; --panel2:#252935; --ink:#ECEDF1; --ink2:#B8BCCB; --mute:#8A90A4; --line:#333846;
    --accent:#F0604B; --accent-soft:#3A2320; --local:#4FB3C6; --local-soft:#16333A; --cloud:#B693E0; --cloud-soft:#2C2340;
    --ok:#6CC58C; --ok-soft:#1D3327; --warn:#E3A94A; --warn-soft:#3A2E17; --code:#11131A;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --paper:#15171E; --panel:#1D2029; --panel2:#252935; --ink:#ECEDF1; --ink2:#B8BCCB; --mute:#8A90A4; --line:#333846;
  --accent:#F0604B; --accent-soft:#3A2320; --local:#4FB3C6; --local-soft:#16333A; --cloud:#B693E0; --cloud-soft:#2C2340;
  --ok:#6CC58C; --ok-soft:#1D3327; --warn:#E3A94A; --warn-soft:#3A2E17; --code:#11131A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:'Assistant',system-ui,-apple-system,sans-serif;font-size:17px;line-height:1.6;margin:0;direction:rtl}
.wrap{max-width:880px;margin:0 auto;padding-inline:20px;padding-block:0 80px}
h1,h2,h3{font-family:'Heebo',system-ui,sans-serif;text-wrap:balance;line-height:1.2;margin:0}
h1{font-size:2.2rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.45rem;font-weight:700;margin-block:0 12px;padding-top:6px}
h3{font-size:1.05rem;font-weight:700;margin-block:20px 8px}
p{margin:0 0 12px}
.lead{font-size:1.15rem;color:var(--ink2);max-width:62ch}
a{color:var(--local)}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
header.hero{padding-block:36px 24px;border-bottom:1px solid var(--line);margin-bottom:8px}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--mute);font-size:.9rem;margin-top:14px}
section{margin-bottom:48px;scroll-margin-top:64px}
.callout{border-inline-start:4px solid var(--accent);background:var(--accent-soft);padding:12px 16px;border-radius:6px;margin:16px 0}
.callout.local{border-color:var(--local);background:var(--local-soft)}
.callout.ok{border-color:var(--ok);background:var(--ok-soft)}
.callout.warn{border-color:var(--warn);background:var(--warn-soft)}
.callout p:last-child{margin:0}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:.78rem;font-weight:700;font-family:'Heebo',sans-serif;white-space:nowrap}
.yes{background:var(--ok-soft);color:var(--ok)} .no{background:var(--accent-soft);color:var(--accent)} .maybe{background:var(--warn-soft);color:var(--warn)}
code,pre{font-family:'IBM Plex Mono',ui-monospace,monospace}
code{background:var(--code);padding:1px 6px;border-radius:4px;font-size:.88em;direction:ltr;unicode-bidi:embed}
ul,ol{padding-inline-start:22px;margin:0 0 12px}
li{margin-bottom:6px}
.num{font-family:'IBM Plex Mono',monospace;font-weight:500;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.exec{border-inline-start:4px solid var(--local);background:var(--local-soft);padding:14px 18px;border-radius:8px}
.exec ol{margin:0;padding-inline-start:22px}
.claim{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:8px 0}
.claim q{quotes:'"' '"';unicode-bidi:isolate}
.claim .actual{margin-top:6px;font-size:.95rem;color:var(--ink2)}
.empty{color:var(--mute)}
h2 small{font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:.8rem;color:var(--mute)}
.wrap{max-width:1100px}
.view{display:none}.view.on{display:block}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media (max-width:760px){.row2{grid-template-columns:1fr}}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:14px}
.box h3{margin:0 0 10px;font-size:1rem;color:var(--mute);letter-spacing:.03em}
label{display:block;font-size:.9rem;color:var(--ink2);margin:10px 0 4px}
input[type=text],select{width:100%;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.btn{font:inherit;font-weight:700;font-family:'Heebo',sans-serif;border:0;border-radius:10px;padding:12px 18px;cursor:pointer;background:var(--panel2);color:var(--ink)}
.btn.rec{background:var(--accent);color:#fff;font-size:1.15rem;width:100%;padding:16px}
.btn.stop{background:var(--ink);color:var(--paper)}
.btn.small{padding:8px 12px;font-size:.9rem}
.btn:disabled{opacity:.5;cursor:default}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:var(--mute);font-size:.9rem;margin-bottom:12px}
.meter{height:10px;background:var(--panel2);border-radius:999px;overflow:hidden;width:160px;display:inline-block;vertical-align:middle}
.meter i{display:block;height:100%;background:var(--ok);width:0%}
.meter.low i{background:var(--warn)}
.list{list-style:none;padding:0;margin:0}.list li{padding:7px 0;border-bottom:1px dashed var(--line);font-size:.95rem}
.list li:last-child{border:0}
.tag{font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--mute);direction:ltr;unicode-bidi:isolate}
.banner{border-inline-start:4px solid var(--warn);background:var(--warn-soft);padding:12px 16px;border-radius:8px;margin:14px 0}
.quiet{color:var(--mute);font-size:.88rem}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.num{font-family:'IBM Plex Mono',monospace;direction:ltr;unicode-bidi:isolate}
textarea{width:100%;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);min-height:60px}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:.78rem;font-weight:700;font-family:'Heebo',sans-serif;white-space:nowrap}
.yes{background:var(--ok-soft);color:var(--ok)} .no{background:var(--accent-soft);color:var(--accent)} .maybe{background:var(--warn-soft);color:var(--warn)} .mw{background:var(--panel2);color:var(--ink2)}
</style>
</head>
<body>
<div class="wrap">
<header class="hero" style="padding-block:22px 14px">
  <div class="bar"><div><span class="eyebrow">Lecture Copilot</span></div><div id="status" class="quiet">מתחבר…</div></div>
</header>

<div id="banner"></div>

<section id="before" class="view">
  <div class="row2">
    <div class="box">
      <h3>הקלטה חדשה</h3>
      <label for="course">קורס</label>
      <select id="course"></select>
      <label for="title">שם ההרצאה</label>
      <input type="text" id="title" placeholder="למשל: מודלים עסקיים ב'">
      <label><input type="checkbox" id="fact" checked> בדיקת עובדות (Gemini)</label>
      <div style="margin-top:14px"><button class="btn rec" id="rec">● הקלט</button></div>
      <details style="margin-top:12px"><summary class="quiet">Replay מקובץ</summary>
        <label for="file">נתיב לקובץ אודיו, .vtt או JSON</label>
        <input type="text" id="file" placeholder="/Users/…/lecture.m4a">
        <div class="actions"><button class="btn small" id="replay">הרץ Replay</button></div>
      </details>
    </div>
    <div class="box">
      <h3>ההרצאה הקודמת</h3>
      <div id="previous" class="quiet">—</div>
      <h3 style="margin-top:16px">חיפוש בזיכרון הקורס</h3>
      <input type="text" id="q" placeholder="מה נאמר על…?">
      <ul class="list" id="hits"></ul>
    </div>
  </div>
</section>

<section id="during" class="view">
  <div class="bar">
    <div><b id="d-title"></b> · <span class="num" id="d-elapsed">00:00</span> · <span class="num" id="d-chunks">0</span> קטעים</div>
    <div>מיקרופון <span class="meter" id="meter"><i></i></span> <span class="num quiet" id="d-level">—</span></div>
  </div>
  <div class="actions">
    <button class="btn" id="mark">★ סמן את זה</button>
    <button class="btn" id="recap">מה פספסתי?</button>
    <button class="btn stop" id="stop">סיום</button>
  </div>
  <div id="recap-out" class="quiet"></div>
  <div class="row2">
    <div>
      <div class="box"><h3>📖 מושגים</h3><ul class="list" id="l-concepts"></ul></div>
      <div class="box"><h3>★ למבחן / הודגש</h3><ul class="list" id="l-highlights"></ul></div>
      <div class="box"><h3>📝 הערה</h3><textarea id="note" placeholder="הערה עם חותמת זמן"></textarea><div class="actions"><button class="btn small" id="add-note">שמור הערה</button></div><ul class="list" id="l-notes"></ul></div>
    </div>
    <div>
      <div class="box"><h3>🔍 טענות מסומנות</h3><ul class="list" id="l-claims"></ul></div>
      <div class="box"><h3>❓ שאלות למרצה</h3><ul class="list" id="l-questions"></ul></div>
      <div class="box"><h3>📌 משימות</h3><ul class="list" id="l-tasks"></ul></div>
    </div>
  </div>
  <div class="quiet" id="d-last"></div>
</section>

<section id="after" class="view">
  <div class="box">
    <h3>סיום</h3>
    <div id="after-body"></div>
    <div class="actions"><button class="btn small" id="again">הקלטה חדשה</button></div>
  </div>
</section>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let state = null;
function show(view){ for (const v of ['before','during','after']) $(v).classList.toggle('on', v === view); }
function hhmm(s){ s = s|0; return `${String(s/3600|0).padStart(2,'0')}:${String(s%3600/60|0).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; }
function list(id, rows, render){ $(id).innerHTML = rows.length ? rows.map(render).join('') : '<li class="quiet">אין עדיין.</li>'; }
async function api(path, opts){ const r = await fetch(path, opts); return r.json(); }

function render(){
  const s = state; if (!s) return;
  $('status').textContent = s.current ? (s.current.status === 'recording' ? 'מקליט' : s.current.status === 'digesting' ? 'מכין Digest…' : s.current.status === 'failed' ? 'תקלה' : 'מוכן') : 'מוכן';
  $('banner').innerHTML = s.interrupted.map(i => `<div class="banner">ההרצאה <b>${esc(i.title)}</b> נקטעה (${i.chunks} קטעים נשמרו). <button class="btn small" data-resume="${i.lecture_id}">סיים והפק Digest</button></div>`).join('');
  document.querySelectorAll('[data-resume]').forEach(b => b.onclick = () => api('/api/resume', {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({lecture_id: b.dataset.resume})}));
  const sel = $('course'); if (sel.options.length !== s.courses.length) sel.innerHTML = s.courses.map(c => `<option>${esc(c)}</option>`).join('');
  $('previous').innerHTML = s.previous.length ? `<b>${esc(s.previous[0].title)}</b><ul class="list">${s.previous[0].bullets.map(b => `<li>${esc(b)}</li>`).join('')}</ul>` : 'אין עדיין הרצאה קודמת בקורס.';
  if (!s.current || s.current.status === 'idle') { show('before'); return; }
  const c = s.current;
  if (c.status === 'recording') {
    show('during');
    $('d-title').textContent = c.title; $('d-chunks').textContent = c.chunks;
    const d = s.dashboard || {};
    list('l-concepts', d.concepts || [], x => `<li><b><bdi>${esc(x.term)}</bdi></b> — ${esc(x.explanation || '')}${x.returned ? ' <span class="tag">נאמר כבר</span>' : ''}</li>`);
    list('l-highlights', d.highlights || [], x => `<li>${x.user ? '★ ' : ''}${esc(x.text)}</li>`);
    list('l-claims', d.claims || [], x => `<li>${esc(x.text)} <span class="pill ${{correct:'yes',incorrect:'no',imprecise:'maybe'}[x.verdict] || 'mw'}">${esc(x.verdict_he)}</span>${x.explanation ? `<div class="quiet">בפועל: ${esc(x.explanation)}</div>` : ''}</li>`);
    list('l-questions', d.questions || [], x => `<li>${esc(x)}</li>`);
    list('l-tasks', d.tasks || [], x => `<li>${esc(x.text)}${x.due ? ` · <span class="num">${esc(x.due)}</span>` : ''}</li>`);
    list('l-notes', d.notes || [], x => `<li><span class="tag">${esc(x.t)}</span> ${esc(x.text)}</li>`);
    $('d-last').textContent = c.last_chunk ? `הקטע האחרון: ${c.last_chunk.status} · ${c.last_chunk.total_s} שנ' · תור ${c.queue_depth}` : 'מחכה לקטע הראשון…';
  } else {
    show('after');
    const dg = c.digest; const v = c.verifier;
    $('after-body').innerHTML = c.status === 'digesting' ? '<p>מכין את ה-Digest… (עד שתי דקות)</p>' :
      c.status === 'failed' ? `<p>תקלה: <span class="num">${esc(c.error)}</span>. הקטעים שנשמרו נמצאים במסד.</p>` :
      `<p><b>${esc(c.title)}</b> · <span class="num">${c.chunks}</span> קטעים · Digest ב-<span class="num">${dg ? dg.digest_s : '?'}</span> שנ'${dg && dg.degraded && dg.degraded.length ? ' · חלקים חסרים: ' + esc(dg.degraded.join(', ')) : ''}</p>
       <p class="quiet">תיקייה: <span class="num">${esc(dg ? dg.folder : '')}</span></p>
       ${v ? `<p class="quiet">בדיקת עובדות: ${v.verified} נבדקו · ${v.unchecked} לא נבדקו · עלות <span class="num">$${c.cost_usd}</span></p>` : '<p class="quiet">בדיקת עובדות כבויה.</p>'}`;
  }
}
async function refresh(){ state = await api('/api/state'); render(); }
function connect(){
  const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.onmessage = ev => { const m = JSON.parse(ev.data);
    if (m.event === 'changed') refresh();
    else if (m.event === 'tick' && state && state.current && state.current.status === 'recording') {
      $('d-elapsed').textContent = hhmm(m.elapsed_s || 0);
      if (m.level != null) { const pct = Math.max(0, Math.min(100, (m.level + 60) / 60 * 100)); $('meter').querySelector('i').style.width = pct + '%'; $('meter').classList.toggle('low', m.level < -40); $('d-level').textContent = m.level.toFixed(0) + ' dB'; }
    } };
  ws.onclose = () => setTimeout(connect, 2000);
}
$('rec').onclick = async () => { const r = await api('/api/record', {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({course: $('course').value, title: $('title').value || 'הרצאה', fact_check: $('fact').checked})}); if (r.error) $('status').textContent = r.error; refresh(); };
$('replay').onclick = async () => { const r = await api('/api/replay', {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({course: $('course').value, title: $('title').value || 'Replay', file: $('file').value, fact_check: $('fact').checked})}); if (r.error) $('status').textContent = r.error; refresh(); };
$('stop').onclick = () => api('/api/stop', {method:'POST'}).then(refresh);
$('mark').onclick = () => api('/api/mark', {method:'POST'}).then(refresh);
$('add-note').onclick = async () => { await api('/api/note', {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({text: $('note').value})}); $('note').value = ''; refresh(); };
$('recap').onclick = async () => { $('recap-out').textContent = 'רגע…'; const r = await api('/api/recap?minutes=5'); $('recap-out').innerHTML = r.bullets.length ? '<ul class="list">' + r.bullets.map(b => `<li>${esc(b)}</li>`).join('') + '</ul>' : esc(r.note); };
$('again').onclick = () => { state.current = null; render(); };
let qt; $('q').addEventListener('input', () => { clearTimeout(qt); qt = setTimeout(async () => { const hits = await api('/api/search?q=' + encodeURIComponent($('q').value)); list('hits', hits, h => `<li><b><bdi>${esc(h.text)}</bdi></b>${h.explanation ? ' — ' + esc(h.explanation) : ''} <span class="tag">${h.week != null ? 'W' + String(h.week).padStart(2,'0') : esc(h.title || '')}</span></li>`); }, 300); });
refresh(); connect();
</script>
</body>
</html>
